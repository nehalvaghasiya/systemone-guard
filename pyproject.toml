[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "systemone-guard"
version = "0.1.0"
description = "From-scratch parallel probabilistic agent-tool authorization classifier"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
cpu = ["torch>=2.0"]
dev = [
    "mypy>=1.18",
    "nbformat>=5.10",
    "pip-audit>=2.9",
    "pre-commit>=4",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.14",
    "twine>=6",
    "tomli>=2; python_version < '3.11'",
]
demo = ["gradio>=4"]
notebook = ["ipython>=8", "nbformat>=5.10", "pandas>=2"]
llm = ["transformers>=4.46", "accelerate>=1.0", "sentencepiece>=0.2"]
publish = ["huggingface-hub>=0.26"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["systemone_guard*"]

[tool.setuptools.package-data]
systemone_guard = ["py.typed"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py310"
line-length = 88
indent-width = 4
src = ["src"]
extend-exclude = ["artifacts", "data", "dist", "build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
# Formatting may reorder imports, but never apply code transformations.
fixable = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["systemone_guard"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
# Interactive setup cells intentionally install dependencies before importing them.
"*.ipynb" = ["E402", "F401"]

[tool.mypy]
python_version = "3.10"
files = ["src", "scripts", "spaces", "tests"]
strict = true
explicit_package_bases = true
mypy_path = ["src"]
show_error_codes = true
# nbformat's validation APIs expose untyped signatures.
untyped_calls_exclude = ["nbformat"]

[[tool.mypy.overrides]]
# These integrations are untyped or optional in the CPU development environment.
module = ["sklearn.*", "nbformat.*", "gradio.*", "transformers.*", "huggingface_hub.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config --import-mode=importlib -m 'not artifacts and not packaging and not optional'"
markers = [
    "artifacts: requires the original local datasets and trained checkpoints",
    "packaging: requires a built wheel and uv",
    "optional: requires the demo, llm, and publish extras",
]

[tool.coverage.run]
source = ["systemone_guard"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
